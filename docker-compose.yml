services:
  mysql:
    image: mysql:8.0
    container_name: inkmill-bug03-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inkmill
      MYSQL_USER: inkmill
      MYSQL_PASSWORD: inkmill
    ports:
      - "3315:3306"
    volumes:
      - inkmill-bug03_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    build: ./backend
    container_name: inkmill-bug03-backend
    restart: unless-stopped
    environment:
      PORT: 9200
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: inkmill
      DB_PASSWORD: inkmill
      DB_NAME: inkmill
      JWT_SECRET: inkmill-jwt-secret-change-me
      SEED_ON_START: "true"
    ports:
      - "9203:9200"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: inkmill-bug03-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: inkmill-bug03-nginx
    restart: unless-stopped
    ports:
      - "4203:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  inkmill-bug03_mysql:
